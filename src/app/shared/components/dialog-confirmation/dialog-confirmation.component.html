<div class="confirm-dialog">
  <p class="confirm-dialog__message">
    {{ data.message }}
  </p>

  <div class="confirm-dialog__actions">
    <button z-button zType="outline" type="button" (click)="cancel()">Cancel</button>

    <button z-button type="button" (click)="confirm()">
      {{ data.yesText ?? 'Yes' }}
    </button>
  </div>
</div>
